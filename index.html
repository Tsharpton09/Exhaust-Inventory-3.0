<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Exhaust Inventory">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<title>Exhaust Inventory</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f4f6f8}
*{box-sizing:border-box}body{margin:0;background:#f4f6f8}.app{max-width:820px;margin:auto;padding:16px 16px 96px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0 18px}
h1{margin:0;font-size:25px;letter-spacing:-.4px}.sub{color:#6b7280;font-size:13px;margin-top:3px}
button{border:0;border-radius:12px;padding:11px 14px;font-weight:750;font-size:14px;cursor:pointer}.primary{background:#111827;color:#fff}.ghost{background:#e8ebef;color:#111827}.danger{background:#fee2e2;color:#991b1b}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}.card{background:#fff;border-radius:16px;padding:13px;box-shadow:0 1px 2px #0000000b}.num{font-size:23px;font-weight:850}.label{font-size:11px;color:#6b7280}
.toolbar{display:flex;gap:8px;margin-bottom:10px}.filters{display:flex;gap:7px;margin-bottom:11px;overflow-x:auto}.filter{flex:1;min-width:90px;background:#e8ebef;color:#111827}.filter.active{background:#111827;color:#fff}.order{background:#dcfce7;color:#166534}.toolbar input{min-width:0;flex:1;padding:13px 14px;border:1px solid #d7dce2;border-radius:13px;background:#fff;font-size:15px}
.tabs{display:flex;gap:7px;margin-bottom:11px}.tab{flex:1;background:#e8ebef}.tab.active{background:#111827;color:#fff}
.list{display:flex;flex-direction:column;gap:9px}.item{background:#fff;border-radius:16px;padding:14px;box-shadow:0 1px 2px #0000000b}.top{display:flex;justify-content:space-between;gap:10px}.name{font-weight:800;font-size:16px}.part{color:#6b7280;font-size:13px;margin-top:2px}.status{font-size:11px;font-weight:850;white-space:nowrap;padding-top:2px}.ok{color:#15803d}.low{color:#b91c1c}.over{color:#92400e}
.stock{font-size:20px;font-weight:850;margin-top:10px}.stock span{font-size:12px;color:#6b7280;font-weight:650}.actions{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:7px;margin-top:11px}.actions button{padding:10px 7px}.empty{background:#fff;border-radius:16px;padding:34px 20px;text-align:center;color:#6b7280}.hint{font-size:13px;margin-top:6px}
footer{position:fixed;bottom:0;left:0;right:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#ffffffed;border-top:1px solid #e2e5e9;backdrop-filter:blur(10px);z-index:5}footer button{display:block;width:min(820px,100%);margin:auto}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;padding:10px;z-index:10}.modal.show{display:flex}.sheet{background:#fff;width:min(820px,100%);border-radius:20px;padding:18px;max-height:92vh;overflow:auto}.sheet h2{margin:0 0 14px}.field{margin-bottom:12px}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:5px}.field input{width:100%;padding:13px;border:1px solid #d7dce2;border-radius:11px;font-size:16px}.field select{width:100%;padding:13px;border:1px solid #d7dce2;border-radius:11px;font-size:16px;background:#fff}.formactions{display:flex;gap:8px}.formactions button{flex:1}.small{font-size:12px;color:#6b7280}.tools{display:flex;gap:7px;margin-top:10px}.tools button{flex:1}
.install{display:none;background:#eef2ff;border:1px solid #dbe3ff;color:#1e3a8a;padding:10px 12px;border-radius:13px;margin-bottom:12px;font-size:13px}.install.show{display:block}.install button{padding:7px 10px;margin-left:5px}
@media(min-width:650px){.modal{align-items:center}.sheet{border-radius:20px}}
</style>
</head>
<body>
<div class="app">
<header><div><h1>Exhaust Inventory</h1><div class="sub">Simple stock control for your parts</div></div><button class="primary" onclick="openAdd()">＋ Add Part</button></header>
<div id="install" class="install">Install this app on your phone for quick access. <button class="primary" onclick="installApp()">Install</button></div>
<section class="cards"><div class="card"><div class="num" id="total">0</div><div class="label">PARTS</div></div><div class="card"><div class="num" id="lowCount">0</div><div class="label">NEED ORDERING</div></div><div class="card"><div class="num" id="units">0</div><div class="label">UNITS IN STOCK</div></div></section>
<div class="toolbar"><input id="search" placeholder="Search name or part number…" oninput="render()"><button class="ghost" onclick="exportCSV()">Export</button></div>
<div class="tabs"><button class="tab active" id="allTab" onclick="setTab('all')">All Parts</button><button class="tab" id="needTab" onclick="setTab('need')">Needs Ordering</button></div><div class="filters"><button class="filter active" id="allMake" onclick="setMake('all')">All</button><button class="filter" id="fordMake" onclick="setMake('ford')">Ford</button><button class="filter" id="chevyMake" onclick="setMake('chevy')">Chevy</button><button class="filter" id="ramMake" onclick="setMake('ram')">Ram</button></div>
<div id="list" class="list"></div>
</div>
<footer><button class="primary" onclick="openAdd()">＋ Add New Part</button></footer>

<div class="modal" id="modal"><div class="sheet">
<h2 id="modalTitle">Add Part</h2>
<form onsubmit="savePart(event)"><input type="hidden" id="editId">
<div class="field"><label>Part Name</label><input id="name" required placeholder='2.5" Exhaust Pipe Kit'></div>
<div class="field"><label>Part Number</label><input id="part" required placeholder="EPK-2500"></div><div class="field"><label>Make</label><select id="make" required><option value="ford">Ford</option><option value="chevy">Chevy</option><option value="ram">Ram</option></select></div><div class="field"><label>Order Parts Link</label><input id="orderLink" type="url" placeholder="https://example.com/order-this-part"><div class="small">Paste the exact website link to use for the Order Parts button.</div></div>
<div class="field"><label>Current Stock</label><input id="stock" type="number" min="0" step="1" required value="0"></div>
<div class="field"><label>Recommended Stock</label><input id="recommended" type="number" min="0" step="1" required value="0"></div>
<div class="tools"><button type="button" class="ghost" onclick="closeModal()">Cancel</button><button class="primary">Save Part</button></div>
</form></div></div>

<script>
// Cloud inventory storage (Supabase)
const SUPABASE_URL = "https://xnqravwfaltpauurormk.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_XTuS30ZaeoIREn9tC5OQCQ_zhIm8iHc";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const KEY="exhaustInventoryV2";
let items=[];
let tab="all",makeFilter="all",deferredPrompt=null,loading=true;
const $=x=>document.getElementById(x);

function setBusy(isBusy){
  loading=isBusy;
  document.body.classList.toggle("busy",isBusy);
}
function showError(message){
  console.error(message);
  alert(message);
}
function normalizeItem(x){
  return {
    id:x.id,
    name:x.name||"",
    part:x.part||"",
    make:(x.make||"ford").toLowerCase(),
    orderLink:x.order_link ?? x.orderLink ?? "",
    stock:Number(x.stock||0),
    recommended:Number(x.recommended||0),
    created_at:x.created_at
  };
}

async function loadInventory(){
  setBusy(true);
  const {data,error}=await supabase.from("inventory").select("*").order("name",{ascending:true});
  if(error){
    console.error("Supabase load error:",error);
    setBusy(false);
    showError("Could not load the cloud inventory. Check your Supabase table name, columns, RLS policies, and Data API access.");
    return;
  }
  items=(data||[]).map(normalizeItem);
  setBusy(false);
  render();
}

function setTab(t){tab=t;$('allTab').classList.toggle('active',t==='all');$('needTab').classList.toggle('active',t==='need');render()}
function setMake(m){
  makeFilter=m;
  ['all','ford','chevy','ram'].forEach(v=>$((v==='all'?'allMake':v+'Make')).classList.toggle('active',v===m));
  render();
}
function openAdd(){
  $('modalTitle').textContent='Add Part';$('editId').value='';$('name').value='';$('part').value='';
  $('make').value='ford';$('orderLink').value='';$('stock').value=0;$('recommended').value=0;
  $('modal').classList.add('show');setTimeout(()=>$('name').focus(),60)
}
function openEdit(id){
  const x=items.find(i=>i.id===id);if(!x)return;
  $('modalTitle').textContent='Edit Part';$('editId').value=id;$('name').value=x.name;$('part').value=x.part;
  $('make').value=x.make||'ford';$('orderLink').value=x.orderLink||'';$('stock').value=x.stock;$('recommended').value=x.recommended;
  $('modal').classList.add('show')
}
function closeModal(){$('modal').classList.remove('show')}

async function savePart(e){
  e.preventDefault();
  const id=$('editId').value;
  let link=$('orderLink').value.trim();
  if(link&&!/^https?:\/\//i.test(link))link='https://'+link;
  const payload={
    name:$('name').value.trim(),
    part:$('part').value.trim(),
    make:$('make').value,
    order_link:link,
    stock:Math.max(0,+$('stock').value),
    recommended:Math.max(0,+$('recommended').value)
  };
  const button=e.submitter; if(button)button.disabled=true;
  try{
    if(id){
      const {data,error}=await supabase.from('inventory').update(payload).eq('id',id).select('*').single();
      if(error)throw error;
      const i=items.findIndex(a=>a.id===id);if(i>=0)items[i]=normalizeItem(data);
    }else{
      const {data,error}=await supabase.from('inventory').insert(payload).select('*').single();
      if(error)throw error;
      items.push(normalizeItem(data));
    }
    closeModal();render();
  }catch(error){
    console.error('Supabase save error:',error);
    showError('Could not save this part to the cloud. Check your Supabase RLS policies and table columns.');
  }finally{if(button)button.disabled=false}
}

async function adjust(id,d){
  const x=items.find(i=>i.id===id);if(!x)return;
  const newStock=Math.max(0,x.stock+d);
  const {data,error}=await supabase.from('inventory').update({stock:newStock}).eq('id',id).select('*').single();
  if(error){console.error('Supabase stock update error:',error);showError('Could not update inventory.');return}
  Object.assign(x,normalizeItem(data));render();
}

async function removeItem(id){
  const x=items.find(i=>i.id===id);
  if(!x||!confirm('Delete '+x.name+' ('+x.part+')?'))return;
  const {error}=await supabase.from('inventory').delete().eq('id',id);
  if(error){console.error('Supabase delete error:',error);showError('Could not delete this part.');return}
  items=items.filter(i=>i.id!==id);render();
}

function orderPart(id){
  const x=items.find(i=>i.id===id);if(!x)return;
  if(x.orderLink)window.open(x.orderLink,'_blank','noopener,noreferrer');
  else alert('No order link has been added for this part. Tap Edit and paste the correct order link.');
}

function render(){
  const q=$('search').value.toLowerCase().trim();
  const f=items.filter(x=>(tab==='all'||x.stock<x.recommended)&&(makeFilter==='all'||(x.make||'ford')===makeFilter)&&(!q||x.name.toLowerCase().includes(q)||x.part.toLowerCase().includes(q)));
  $('total').textContent=items.length;
  $('lowCount').textContent=items.filter(x=>x.stock<x.recommended).length;
  $('units').textContent=items.reduce((a,x)=>a+x.stock,0);
  if(!f.length){
    $('list').innerHTML=`<div class="empty">${items.length?'No parts match this view.':'No inventory yet.'}<div class="hint">${items.length?'Try another search or filter.':'Tap Add Part to enter your first exhaust component.'}</div></div>`;return
  }
  $('list').innerHTML=f.map(x=>{
    const need=Math.max(0,x.recommended-x.stock),c=need?'low':x.stock>x.recommended?'over':'ok',s=need?'ORDER '+need:x.stock>x.recommended?'OVER':'OK';
    const makeLabel={ford:'Ford',chevy:'Chevy',ram:'Ram'}[x.make||'ford']||x.make;
    return `<div class="item"><div class="top"><div><div class="name">${esc(x.name)}</div><div class="part">(${esc(x.part)}) · ${esc(makeLabel)}</div></div><div class="status ${c}">${s}</div></div><div class="stock">${x.stock} <span>| Recommended ${x.recommended}</span></div><div class="actions"><button class="ghost" onclick="adjust('${x.id}',-1)">− 1</button><button class="ghost" onclick="adjust('${x.id}',1)">＋ 1</button><button class="ghost" onclick="openEdit('${x.id}')">Edit</button><button class="danger" onclick="removeItem('${x.id}')">Delete</button></div><div style="margin-top:7px"><button class="order" style="width:100%" onclick="orderPart('${x.id}')">Order Parts</button></div></div>`
  }).join('')
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function exportCSV(){
  let rows=[['Part Name','Part Number','Make','Current Stock','Recommended Stock','Order Qty','Order Link'],...items.map(x=>[x.name,x.part,x.make,x.stock,x.recommended,Math.max(0,x.recommended-x.stock),x.orderLink||''])];
  let csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n'),a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='exhaust-inventory.csv';a.click();URL.revokeObjectURL(a.href)
}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('install').classList.add('show')});
async function installApp(){if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('install').classList.remove('show')}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
loadInventory();
</script>
</body></html>
